    // --- UTILS ---
    const calculateDaysDiff = (dateString) => {
      if (!dateString) return 0;
      const start = new Date(dateString);
      const now = new Date();
      const diffTime = Math.abs(now.getTime() - start.getTime());
      return Math.ceil(diffTime / (1000 * 60 * 60 * 24));
    };

    const formatDate = (dateString) => {
      if (!dateString) return '-';
      const date = new Date(dateString + 'T12:00:00');
      return new Intl.DateTimeFormat('pt-BR').format(date);
    };

    const THRESHOLD_IMPRISONMENT = 365;
    const THRESHOLD_REVIEW = 89;

      if (days > threshold) return isCritical ? 'bg-red-100 text-red-800 font-bold border-red-200' : 'bg-orange-100 text-orange-800 font-medium border-orange-200';
      return 'text-slate-600';

    // --- COMPONENTS ---
    // AuthScreen revertido (sem GitHub)

    const AuthScreen = ({ onLogin }) => {

            setMessage('Cadastro realizado! Verifique seu e-mail para confirmar a conta antes de entrar.');

          } else {
            const { data, error } = await supabase.auth.signInWithPassword({ email, password });
            if (error) throw error;
            onLogin(data.session);
          }
        } catch (err) {
          setError(err.message === 'Invalid login credentials' ? 'E-mail ou senha incorretos' : err.message);
        } finally {

      return (
        <div className="min-h-screen auth-bg flex items-center justify-center p-4">

                <div className="col-span-1 md:col-span-2 lg:col-span-3 pb-2 border-b border-gray-100 mb-2 mt-4"><h3 className="text-sm font-semibold text-justice-700 uppercase tracking-wider mb-4">Controle de Prazos</h3></div>
                <div><label className="block text-sm font-medium text-gray-700 mb-1">Data Última Prisão</label><input type="date" name="arrestDate" value={formData.arrestDate} onChange={handleChange} className="w-full border border-gray-300 rounded px-3 py-2 focus:ring-2 focus:ring-justice-500 outline-none" /></div>
                <div><label className="block text-sm font-medium text-gray-700 mb-1">Data Última Revisão (90 dias)</label><input type="date" name="lastReviewDate" value={formData.lastReviewDate} onChange={handleChange} className="w-full border border-gray-300 rounded px-3 py-2 focus:ring-2 focus:ring-justice-500 outline-none" /></div>

                <div><label className="block text-sm font-medium text-gray-700 mb-1">Tipo de Movimentação</label>
                  <select name="movementType" value={formData.movementType} onChange={handleChange} className="w-full border border-gray-300 rounded px-3 py-2 focus:ring-2 focus:ring-justice-500 outline-none">
                    <option value="Aguardando Sentença">Aguardando Sentença</option><option value="Aguardando Audiência">Aguardando Audiência</option><option value="Concluso para julgamento">Concluso para julgamento</option>
                    <option value="Aguardando Inquérito">Aguardando Inquérito</option><option value="Denúncia Oferecida">Denúncia Oferecida</option><option value="Recebida Denúncia">Recebida Denúncia</option>
                    <option value="Expedido mandado citação">Expedido mandado citação</option><option value="Aguardando Defesa Prévia">Aguardando Defesa Prévia</option><option value="Vista ao MP">Vista ao MP</option>
                    <option value="Concluso para despacho">Concluso para despacho</option><option value="Concluso para decisão">Concluso para decisão</option>

                <div><label className="block text-sm font-medium text-gray-700 mb-1">BNMP</label><input name="bnmp" value={formData.bnmp} onChange={handleChange} className="w-full border border-gray-300 rounded px-3 py-2 focus:ring-2 focus:ring-justice-500 outline-none" /></div>

    // --- APP COMPONENT ---

    function App() {
      const [session, setSession] = useState(null);
      const [loadingSession, setLoadingSession] = useState(true);
      const [defendants, setDefendants] = useState([]);
      const [loadingData, setLoadingData] = useState(false);

      const [isFormOpen, setIsFormOpen] = useState(false);
      const [editingId, setEditingId] = useState(null);
      const [searchTerm, setSearchTerm] = useState('');
      const [aiModalOpen, setAiModalOpen] = useState(false);
      const [selectedDefendantForAI, setSelectedDefendantForAI] = useState(null);
      const [aiAnalysis, setAiAnalysis] = useState('');
      const [loadingAi, setLoadingAi] = useState(false);

      // Court Name Feature (Local Persistence)
      const [courtName, setCourtName] = useState(() => localStorage.getItem('court_name') || 'Vara Única de Goianésia do Pará');

      const handleEditCourtName = () => {
        const newName = prompt("Digite o nome da Vara/Comarca:", courtName);
        if (newName && newName.trim() !== '') {
          setCourtName(newName);
          localStorage.setItem('court_name', newName); // Save locally for this user/browser
        }
      };

      // Auth Initialization
      useEffect(() => {
        supabase.auth.getSession().then(({ data: { session } }) => {
          setSession(session);
          setLoadingSession(false);
        });

        const { data: { subscription } } = supabase.auth.onAuthStateChange((_event, session) => {
          setSession(session);
        });
        return () => subscription.unsubscribe();
      }, []);

      // Data Fetching
      const fetchDefendants = async () => {
        if (!session) return;
        setLoadingData(true);
        const { data, error } = await supabase.from('defendants').select('*').order('created_at', { ascending: false });

        if (error) {
          console.error('Erro ao buscar:', error);
          alert('Erro ao carregar dados: ' + error.message);
        } else {
          // Map snake_case -> camelCase
          setDefendants(data.map(d => ({
            id: d.id, name: d.name, caseNumber: d.case_number, penalType: d.penal_type,
            arrestDate: d.arrest_date, lastReviewDate: d.last_review_date,
            movementType: d.movement_type, lastMovementDate: d.last_movement_date,
            deadline: d.deadline, obs: d.obs, rji: d.rji, bnmp: d.bnmp, infopen: d.infopen,
            prison: d.prison, user_id: d.user_id
          })));
        }
        setLoadingData(false);
      };

      useEffect(() => {
        if (session) fetchDefendants();
      }, [session]);

      // Handlers
      const handleSave = async (data) => {
        // Map camelCase -> snake_case
        const payload = {
          name: data.name, case_number: data.caseNumber, penal_type: data.penalType,
          arrest_date: data.arrestDate, last_review_date: data.lastReviewDate,
          movement_type: data.movementType, last_movement_date: data.lastMovementDate,
          deadline: data.deadline, obs: data.obs, rji: data.rji, bnmp: data.bnmp,
          infopen: data.infopen, prison: data.prison, user_id: session.user.id
        };

        if (editingId) {
          const { error } = await supabase.from('defendants').update(payload).eq('id', editingId);
          if (error) { alert('Erro ao atualizar: ' + error.message); return; }
        } else {
          const { error } = await supabase.from('defendants').insert([payload]);
          if (error) { alert('Erro ao criar: ' + error.message); return; }
        }

        await fetchDefendants();
        setIsFormOpen(false); setEditingId(null);
      };

      const handleDelete = async (id) => {
        if (window.confirm('Tem certeza que deseja excluir da nuvem?')) {
          const { error } = await supabase.from('defendants').delete().eq('id', id);
          if (error) alert('Erro ao excluir: ' + error.message);
          else await fetchDefendants();
        }
      };

      const handleAIAnalysis = async (defendant) => {
        setSelectedDefendantForAI(defendant);
        setAiModalOpen(true);
        setLoadingAi(true);
        setAiAnalysis('');
        const result = await generateLegalAnalysis(defendant);
        setAiAnalysis(result);
        setLoadingAi(false);
      };

      const stats = useMemo(() => {
        let expiredReviews = 0, longImprisonment = 0, stalledCases = 0;
        defendants.forEach(d => {
          if (calculateDaysDiff(d.lastReviewDate) > THRESHOLD_REVIEW) expiredReviews++;
          if (calculateDaysDiff(d.arrestDate) > THRESHOLD_IMPRISONMENT) longImprisonment++;
          if (calculateDaysDiff(d.lastMovementDate) > d.deadline) stalledCases++;
        });
        return { total: defendants.length, expiredReviews, longImprisonment, stalledCases };
      }, [defendants]);

      const filteredDefendants = defendants.filter(d =>
        d.name.toLowerCase().includes(searchTerm.toLowerCase()) || d.caseNumber.includes(searchTerm)
      );

      const exportToCSV = () => {
        const headers = ['Nome', 'Processo', 'Tipo Penal', 'Prisão', 'Revisão', 'Movimentação', 'Data Mov.', 'Prazo', 'Presídio', 'OBS'];
        const csvContent = [headers.join(','), ...defendants.map(d => [
          `"${d.name}"`, `"${d.caseNumber}"`, `"${d.penalType}"`, d.arrestDate, d.lastReviewDate,
          `"${d.movementType}"`, d.lastMovementDate, d.deadline, `"${d.prison}"`, `"${d.obs || ''}"`
        ].join(','))].join('\n');
        const link = document.createElement("a");
        link.href = URL.createObjectURL(new Blob([csvContent], { type: 'text/csv;charset=utf-8;' }));
        link.download = `relatorio_${new Date().toISOString().split('T')[0]}.csv`;
        link.click();
      };

      const generatePDF = () => {
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF('l', 'mm', 'a4');
        doc.setFontSize(16); doc.setTextColor(40); doc.text("Relatório de Controle de Réus Presos", 14, 15);
        doc.setFontSize(10); doc.setTextColor(100); doc.text(`Gerado em: ${new Date().toLocaleDateString('pt-BR')} (Cloud) - ${courtName}`, 14, 22);

        const rows = defendants.map(d => [
          d.name, d.caseNumber, d.penalType,
          `${formatDate(d.arrestDate)}\n(${calculateDaysDiff(d.arrestDate)} dias)`,
          `${formatDate(d.lastReviewDate)}\n(${calculateDaysDiff(d.lastReviewDate)} dias)`,
          d.movementType, `${d.deadline}d`, d.prison, d.obs || '-'
        ]);
        doc.autoTable({
          head: [["Nome", "Processo", "Tipo Penal", "Prisão", "Revisão", "Movimenta.", "Prazo", "Presídio", "Obs"]],
          body: rows, startY: 25, theme: 'grid', styles: { fontSize: 8, cellPadding: 2 },
          headStyles: { fillColor: [14, 165, 233], textColor: 255, fontStyle: 'bold' },
          columnStyles: { 0: { cellWidth: 35 }, 1: { cellWidth: 35 }, 8: { cellWidth: 40 } }
        });
        doc.save(`relatorio_${new Date().toISOString().split('T')[0]}.pdf`);
      };

      if (loadingSession) return <div className="h-screen w-full flex items-center justify-center bg-gray-50"><div className="animate-spin rounded-full h-12 w-12 border-b-2 border-justice-600"></div></div>;
      if (!session) return <AuthScreen onLogin={setSession} />;

      return (
        <div className="min-h-screen bg-gray-100 flex flex-col font-sans">
          <header className="bg-justice-900 text-white shadow-lg">
            <div className="container mx-auto px-4 py-4 flex flex-col md:flex-row justify-between items-center gap-4">
              <div className="flex items-center gap-3">
                <div className="bg-white/10 p-2 rounded-full"><Scale size={28} className="text-white" /></div>
                <div>
                  <h1 className="text-xl font-bold leading-tight flex items-center gap-2 cursor-pointer group hover:text-justice-100 transition-colors" onClick={handleEditCourtName} title="Clique para editar o nome">
                    {courtName}
                    <Edit size={16} className="opacity-50 group-hover:opacity-100" />
                  </h1>
                  <p className="text-justice-100 text-xs uppercase tracking-widest">Controle de Réus Presos • Cloud</p>
                </div>
              </div>
              <div className="flex items-center gap-4">
                <div className="text-right hidden md:block border-r border-justice-700 pr-4 mr-1">
                  <p className="text-xs text-justice-300">Conectado como</p><p className="text-sm font-medium">{session.user.email}</p>
                </div>
                <button onClick={() => supabase.auth.signOut()} className="text-justice-200 hover:text-white" title="Sair"><LogOut size={20} /></button>
              </div>
            </div>
          </header>

          <div className="bg-white border-b border-gray-200 shadow-sm">
            <div className="container mx-auto px-4 py-3 flex justify-end gap-3">
              <button onClick={exportToCSV} className="text-gray-600 hover:text-emerald-600 px-3 py-1 text-sm border border-gray-300 rounded hover:border-emerald-500 flex items-center gap-2"><Download size={16} /> Exportar</button>
              <button onClick={generatePDF} className="text-gray-600 hover:text-red-600 px-3 py-1 text-sm border border-gray-300 rounded hover:border-red-500 flex items-center gap-2"><FileText size={16} /> PDF</button>
              <button onClick={() => { setEditingId(null); setIsFormOpen(true); }} className="bg-justice-600 hover:bg-justice-700 text-white px-4 py-1.5 rounded text-sm font-medium shadow-sm flex items-center gap-2"><Plus size={16} /> Novo Réu</button>
            </div>
          </div>

          <div className="container mx-auto px-4 py-6">
            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4 mb-6">
              <div className="bg-white p-4 rounded-lg shadow-sm border-l-4 border-justice-500 flex items-center justify-between"><div><p className="text-gray-500 text-xs uppercase font-bold tracking-wider">Total de Réus</p><p className="text-3xl font-bold text-gray-800">{loadingData ? '...' : stats.total}</p></div><Users className="text-justice-200" size={32} /></div>
              <div className={`bg-white p-4 rounded-lg shadow-sm border-l-4 flex items-center justify-between ${stats.expiredReviews > 0 ? 'border-red-500 bg-red-50' : 'border-green-500'}`}><div><p className="text-gray-500 text-xs uppercase font-bold tracking-wider">Revisão Vencida</p><p className={`text-3xl font-bold ${stats.expiredReviews > 0 ? 'text-red-600' : 'text-gray-800'}`}>{loadingData ? '...' : stats.expiredReviews}</p></div><AlertOctagon className={stats.expiredReviews > 0 ? 'text-red-300' : 'text-green-200'} size={32} /></div>
              <div className={`bg-white p-4 rounded-lg shadow-sm border-l-4 flex items-center justify-between ${stats.longImprisonment > 0 ? 'border-orange-500' : 'border-blue-300'}`}><div><p className="text-gray-500 text-xs uppercase font-bold tracking-wider">Prisão Longa</p><p className="text-3xl font-bold text-gray-800">{loadingData ? '...' : stats.longImprisonment}</p></div><Calendar className="text-orange-200" size={32} /></div>
              <div className="bg-white p-4 rounded-lg shadow-sm border-l-4 border-yellow-400 flex items-center justify-between"><div><p className="text-gray-500 text-xs uppercase font-bold tracking-wider">Processos Paralisados</p><p className="text-3xl font-bold text-gray-800">{loadingData ? '...' : stats.stalledCases}</p></div><Clock className="text-yellow-200" size={32} /></div>
            </div>

            <div className="bg-white rounded-lg shadow-sm p-4 mb-6 flex flex-col md:flex-row gap-4 justify-between items-center">
              <div className="relative w-full md:w-96"><Search className="absolute left-3 top-1/2 transform -translate-y-1/2 text-gray-400" size={18} /><input type="text" placeholder="Buscar por nome ou número do processo..." className="w-full pl-10 pr-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-justice-500" value={searchTerm} onChange={(e) => setSearchTerm(e.target.value)} /></div>
              <div className="text-sm text-gray-500">{loadingData ? 'Carregando...' : `Mostrando ${filteredDefendants.length} registros`}</div>
            </div>

            <div className="bg-white rounded-lg shadow overflow-hidden overflow-x-auto min-h-[300px]">
              {loadingData ? (
                <div className="flex flex-col items-center justify-center py-20"><div className="animate-spin rounded-full h-8 w-8 border-b-2 border-justice-600 mb-2"></div><p className="text-gray-400 text-sm">Sincronizando com a nuvem...</p></div>
              ) : (
                <table className="min-w-full divide-y divide-gray-200">
                  <thead className="bg-gray-50">
                    <tr>
                      <th className="px-4 py-3 text-left text-xs font-bold text-gray-500 uppercase tracking-wider">Réu / Processo</th>
                      <th className="px-4 py-3 text-left text-xs font-bold text-gray-500 uppercase tracking-wider">Prisão (Dias)</th>
                      <th className="px-4 py-3 text-left text-xs font-bold text-gray-500 uppercase tracking-wider">Última Revisão</th>
                      <th className="px-4 py-3 text-left text-xs font-bold text-gray-500 uppercase tracking-wider">Movimentação</th>
                      <th className="px-4 py-3 text-left text-xs font-bold text-gray-500 uppercase tracking-wider">Status Prazo</th>
                      <th className="px-4 py-3 text-left text-xs font-bold text-gray-500 uppercase tracking-wider">Local</th>
                      <th className="px-4 py-3 text-left text-xs font-bold text-gray-500 uppercase tracking-wider">Obs</th>
                      <th className="px-4 py-3 text-right text-xs font-bold text-gray-500 uppercase tracking-wider">Ações</th>
                    </tr>
                  </thead>
                  <tbody className="bg-white divide-y divide-gray-200">
                    {filteredDefendants.map((defendant) => {
                      const daysImprisoned = calculateDaysDiff(defendant.arrestDate);
                      const daysSinceReview = calculateDaysDiff(defendant.lastReviewDate);
                      const daysStalled = calculateDaysDiff(defendant.lastMovementDate);
                      const isStalled = daysStalled > defendant.deadline;

                      return (
                        <tr key={defendant.id} className="hover:bg-gray-50 transition-colors">
                          <td className="px-4 py-4 whitespace-nowrap"><div className="flex flex-col"><span className="text-sm font-bold text-gray-900">{defendant.name}</span><span className="text-xs text-gray-500 font-mono">{defendant.caseNumber}</span><span className="text-xs text-justice-600 mt-1">{defendant.penalType}</span></div></td>
                          <td className="px-4 py-4 whitespace-nowrap"><div className={`px-2 py-1 rounded-md text-xs inline-flex flex-col items-center border ${getStatusColor(daysImprisoned, THRESHOLD_IMPRISONMENT)}`}><span className="font-bold">{daysImprisoned} dias</span><span className="text-[10px] opacity-75">{formatDate(defendant.arrestDate)}</span></div></td>
                          <td className="px-4 py-4 whitespace-nowrap"><div className={`px-2 py-1 rounded-md text-xs inline-flex flex-col items-center border ${getStatusColor(daysSinceReview, THRESHOLD_REVIEW, true)}`}><span className="font-bold">{daysSinceReview} dias atrás</span><span className="text-[10px] opacity-75">{formatDate(defendant.lastReviewDate)}</span></div></td>
                          <td className="px-4 py-4 whitespace-nowrap"><div className="flex flex-col"><span className="text-sm text-gray-900">{defendant.movementType}</span><span className="text-xs text-gray-500">{formatDate(defendant.lastMovementDate)}</span></div></td>
                          <td className="px-4 py-4 whitespace-nowrap"><div className={`flex items-center gap-2 ${isStalled ? 'text-red-600 font-bold' : 'text-green-600'}`}>{isStalled ? <AlertTriangle size={16} /> : <Clock size={16} />}<span className="text-sm">{daysStalled} / {defendant.deadline} dias</span></div></td>
                          <td className="px-4 py-4 whitespace-nowrap"><span className="text-sm text-gray-700">{defendant.prison}</span>{defendant.rji && <span className="block text-xs text-gray-400">RJI: {defendant.rji}</span>}</td>
                          <td className="px-4 py-4 whitespace-nowrap">{defendant.obs && (<div className="group relative flex justify-center"><Info size={20} className="text-gray-400 cursor-help" /><div className="group-hover:block hidden absolute z-10 w-64 p-2 mt-6 -ml-32 text-xs leading-tight text-white transition-all duration-150 transform -translate-x-1/2 bg-gray-900 rounded shadow-lg">{defendant.obs}<div className="absolute top-0 w-3 h-3 -mt-1 bg-gray-900 transform rotate-45 left-1/2 -translate-x-1/2"></div></div></div>)}</td>
                          <td className="px-4 py-4 whitespace-nowrap text-right text-sm font-medium">
                            <div className="flex items-center justify-end gap-2">
                              <button onClick={() => handleAIAnalysis(defendant)} className="text-justice-600 hover:text-justice-900 p-1" title="Análise IA"><Bot size={18} /></button>
                              <button onClick={() => handleEdit(defendant)} className="text-indigo-600 hover:text-indigo-900 p-1" title="Editar"><FileText size={18} /></button>
                              <button onClick={() => handleDelete(defendant.id)} className="text-red-600 hover:text-red-900 p-1" title="Excluir"><AlertOctagon size={18} /></button>
                            </div>
                          </td>
                        </tr>
                      );
                    })}
                  </tbody>
                </table>
              )}
              {!loadingData && filteredDefendants.length === 0 && <div className="p-8 text-center text-gray-500">Nenhum réu encontrado. Comece clicando em "Novo Réu".</div>}
            </div>
          </div>
          {isFormOpen && (<DefendantForm initialData={editingId ? defendants.find(d => d.id === editingId) : undefined} onSubmit={handleSave} onCancel={() => { setIsFormOpen(false); setEditingId(null); }} />)}
          {aiModalOpen && selectedDefendantForAI && (<div className="fixed inset-0 bg-black/50 flex items-center justify-center z-50 p-4"><div className="bg-white rounded-lg shadow-xl w-full max-w-2xl flex flex-col max-h-[80vh]"><div className="p-4 border-b border-gray-200 flex justify-between items-center bg-justice-50 rounded-t-lg"><div className="flex items-center gap-2"><Bot className="text-justice-600" /><h3 className="font-bold text-lg text-justice-800">Assistente Jurídico Virtual</h3></div><button onClick={() => setAiModalOpen(false)}><XIcon className="text-gray-400 hover:text-gray-600" size={24} /></button></div><div className="p-6 overflow-y-auto">{loadingAi ? (<div className="flex flex-col items-center justify-center py-12"><div className="animate-spin rounded-full h-12 w-12 border-b-2 border-justice-600 mb-4"></div><p className="text-gray-500">Analisando situação...</p></div>) : (<div className="space-y-4"><div className="bg-blue-50 p-4 rounded-md border border-blue-100"><p className="font-semibold text-blue-900 text-sm mb-2">Análise para: {selectedDefendantForAI.name}</p><p className="text-xs text-blue-700">Processo: {selectedDefendantForAI.caseNumber}</p></div><div className="prose prose-sm max-w-none text-gray-700"><p className="whitespace-pre-line leading-relaxed">{aiAnalysis}</p></div></div>)}</div></div></div>)}
        </div>
      );
    }
    const root = ReactDOM.createRoot(document.getElementById('root')); root.render(<App />);
  </script>
</body>

</html>
